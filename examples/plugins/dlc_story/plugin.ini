; Example data plugin: a "DLC Story" entry in game select's Features menu that plays the plugin's own scene, made
; with the inspector's scene builder (docs/PLUGINS.md, "Stories" and "Scene recipes"). No library.
[Plugin]
Name = DLC Story
Version = 1.0

[Story]
; The menu text: Key in the plugin's loctext, in the game's language; Name when that is missing.
Name = DLC Story
Loctext = aid_loctext_plugin_dlcstory
Key = dlcstory__MenuItem
; The story's scenes, in order. Game select follows the last.
Scenes = aid_script_dlcstory_impambush
