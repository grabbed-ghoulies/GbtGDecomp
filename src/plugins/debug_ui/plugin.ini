; The debug UI (Dear ImGui): F8 opens the menu bar, F12 toggles the timing overlay. Retail has none of it.
[Plugin]
Name = Debug UI
Version = 1.0
Library = gbtg_debug_ui

[DebugUi]
; 1 opens the menu bar at startup.
OpenMenu = 0
; 1 or 0 shows or hides the timing overlay at startup; without it, Debug builds show it and Release builds hide it.
; TimingOverlay = 1
