; Rare Replay: the game's logic ticks faster than retail's 30 Hz. The game scales its motion and timers by the step;
; the code that counts ticks instead keeps counting 1/30 s ticks (docs/PLUGINS.md, "Rare Replay"). Retail has none
; of it.
[Plugin]
Name = Rare Replay
Version = 1.0
Features = rare_replay

[rare_replay]
; 1 ticks the logic once per frame, so the frame rate follows the monitor ([Video] VSync=1) or runs as fast as the PC
; can (VSync=0). 0 ticks at a fixed 60 Hz, as the Rare Replay release does.
TickPerFrame = 1
