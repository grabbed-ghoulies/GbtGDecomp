; Wide aspect: gameplay views wider than 16:9, such as 21:9 or 32:9. The view keeps 16:9's vertical field of view
; and shows more at the sides; cameras and cutscenes that keep their own 4:3 or 16:9 shape fit inside the wider frame
; as they do in widescreen (docs/PLUGINS.md, "Wide aspect"). Needs [Video] Widescreen=1. Retail has none of it.
[Plugin]
Name = Wide Aspect
Version = 1.0
Features = wide_aspect

[wide_aspect]
; auto: the back buffer's shape ([Video] Width x Height) when it is wider than 16:9. Or W:H (21:9, 32:9) or a ratio.
Aspect = auto
; The HUD's shape: 4:3 keeps the HUD, captions and prompts in their own proportions, centred in the frame (also in
; plain 16:9 widescreen). stretch spreads them over the frame as retail does. Or W:H (16:9) or a ratio.
Hud = 4:3
